<style>
  /* Match list — page-specific. Shell lives in app.css. */
  .ic{width:18px; height:18px; flex:0 0 auto}
  .nico{display:inline-flex; width:15px; height:15px; margin-right:7px}
  .nico .ic{width:15px; height:15px}
  .spacer{flex:1}
  ::selection{background:var(--accent-wash); color:var(--text)}
  @keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* status groups */
  .grp{margin-bottom:22px}
  .grp:last-child{margin-bottom:0}
  .grp-h{display:flex; align-items:center; gap:9px; margin:2px 0 11px}
  .grp-h .lbl{font-size:12.5px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; color:var(--text-3)}
  .grp-h .n{font-size:11.5px; font-weight:700; color:var(--text-3); background:var(--bg-elev-2);
    border-radius:999px; padding:2px 9px; min-width:24px; text-align:center}
  .grp.is-live .grp-h .lbl{color:var(--live)}
  .grp.is-live .grp-h .n{background:var(--live); color:#fff}
  .subday{font-size:13px; color:var(--text-2); font-weight:600; margin:14px 0 8px; letter-spacing:-.1px}
  .subday:first-child{margin-top:0}
  .day-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px}

  /* one row per team, status column on the right (Apple Sports layout) */
  .match{background:var(--bg-elev-2); border-radius:14px; padding:11px 13px 12px;
    display:flex; flex-direction:column; gap:9px; transition:background .2s;
    animation:rise .4s var(--ease) both; animation-delay:calc(var(--i,0)*35ms)}
  .match:hover{background:var(--bg-hover)}
  .match.live{box-shadow:inset 3px 0 0 var(--live)}
  .ap-league{font-size:11.5px; color:var(--text-3); font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ap-main{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center}
  .ap-teams{display:flex; flex-direction:column; gap:9px; min-width:0}
  .ap-row{display:grid; grid-template-columns:24px 1fr auto; gap:11px; align-items:center; min-width:0}
  .ap-badge{width:24px; height:24px; display:flex; align-items:center; justify-content:center}
  .ap-badge img{max-width:24px; max-height:24px; object-fit:contain}
  .ap-name{font-size:15px; font-weight:600; color:var(--text); letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ap-score{font-size:19px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums;
    letter-spacing:-.3px; min-width:14px; text-align:right; white-space:nowrap}
  /* the losing side of a decided match recedes */
  .ap-row.dim .ap-name,.ap-row.dim .ap-score{color:var(--text-2)}
  .ap-status{display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:2px;
    min-width:56px; padding-left:12px; border-left:1px solid var(--sep); align-self:stretch}
  .ap-st{font-size:12.5px; font-weight:600; color:var(--text-2); white-space:nowrap}
  .ap-st.hot{color:var(--live)}
  .ap-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--live);
    margin-right:5px; vertical-align:1px; animation:blink 1.4s ease-in-out infinite}
  .ap-time{font-size:15px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:-.2px}
  .ap-sub{font-size:9.5px; font-weight:600; color:var(--text-3); letter-spacing:.7px}
  .ap-venue{font-size:11px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  @media (max-width:560px){
    .day-grid{grid-template-columns:1fr}
    .ap-status{min-width:52px; padding-left:10px}
    .ap-name{font-size:14.5px}
  }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none !important; transition:none !important} }
</style>
