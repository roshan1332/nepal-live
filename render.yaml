services:
  - type: web
    name: nepal-live
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      # accounts in Supabase — fill these in the Render dashboard (sync: false keeps them out of this file)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # owner-only visits page (/stats): your Nepal Live login email(s), comma-separated
      - key: ADMIN_EMAILS
        sync: false
